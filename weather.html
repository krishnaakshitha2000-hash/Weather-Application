<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather APP</title>
    <link rel="stylesheet" href="wether.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
</head>

<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false">
            <button class="search-btn">
                <span class="material-symbols-outlined">search</span>
            </button>
        </div>
        <div class="error">
            <p>invalid city name</p>
        </div>

        <div class="weather">
            <!-- <span class="material-symbols-outlined weather-icon">weather_hail</span> -->
             <img class="weather-icon" src="" alt="weather icon">


            <h1 class="temp">22°C</h1>
            <h2 class="city">Thrissur</h2>

            <div class="details">
                <div class="col">
                    <span class="material-symbols-outlined">cool_to_dry</span>
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="col">
                    <span class="material-symbols-outlined">airwave</span>
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
const apikey = "509f56635b664313d2a9f7b254718c6d";
const apiurl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

const searchBox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");
const weathericon = document.querySelector(".weather-icon");

async function checkweather(city) {
    const response = await fetch(`${apiurl}${city}&appid=${apikey}`);
    if(response.status==404){
        document.querySelector(".error").style.display="block";
         document.querySelector(".weather").style.display="none";
    }else{

    }
    const data = await response.json();
    console.log("API response:", data); 

    if (data.cod === 404) {
        alert("City not found!");
        return;
    }

    document.querySelector(".city").innerHTML = data.name;
    document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
    document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
    document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";
    if (data.weather[0].main === "Rain") {
        weathericon.src = "https://tse1.mm.bing.net/th/id/OIP.iC3NxXC9qWajRR7HX8N3cQHaFq?pid=Api&P=0&h=180";
    }
    else if (data.weather[0].main === "Clear") {
        weathericon.src = "https://static.vecteezy.com/system/resources/previews/011/126/301/original/animated-cloud-with-sun-depicting-weather-in-flat-icon-clipart-illustration-on-blue-sky-vector.jpg";
    }
    else if (data.weather[0].main === "Clouds") {
        weathericon.src = "https://img.freepik.com/premium-vector/cartoon-clouds-abstract-white-cloudscape-icon-symbol-vector-cloudy-landscape-simplicity-nature-aerial-panorama-round-shapes-flat-style_93083-2781.jpg";
    }
    else if (data.weather[0].main === "Drizzle") {
        weathericon.src = "https://tse4.mm.bing.net/th/id/OIP.egvy_Sz7-KFyeEutV_WwaAAAAA?pid=Api&P=0&h=180";
    }
    else if (data.weather[0].main === "Mist") {
        weathericon.src = "https://tse1.mm.bing.net/th/id/OIP.jlpcr-S1C9H89Kh50eJCtwHaHa?pid=Api&P=0&h=180";
    }

    document.querySelector(".weather").style.display="block";
    document.querySelector(".error").style.display="none";



    // if (data.weather[0]. main=="rain"){
    //     weathericon.src="https://tse1.mm.bing.net/th/id/OIP.iC3NxXC9qWajRR7HX8N3cQHaFq?pid=Api&P=0&h=180"

    // }
    // else if(data.weather[0].main=="clear"){
    //     weathericon.src="https://static.vecteezy.com/system/resources/previews/011/126/301/original/animated-cloud-with-sun-depicting-weather-in-flat-icon-clipart-illustration-on-blue-sky-vector.jpg"

    // }
    // else if(data.weathericon[0].main=="clouds"){
    //     weathericon.src="https://img.freepik.com/premium-vector/cartoon-clouds-abstract-white-cloudscape-icon-symbol-vector-cloudy-landscape-simplicity-nature-aerial-panorama-round-shapes-flat-style_93083-2781.jpg"

    // }
    // else if(data.weathericon[0].main=="Drizzle"){
    //     weathericon.src="https://tse4.mm.bing.net/th/id/OIP.egvy_Sz7-KFyeEutV_WwaAAAAA?pid=Api&P=0&h=180"

    // }
    // else if(data.weathericon[0].main=="mist"){
    //     weathericon.src="https://tse1.mm.bing.net/th/id/OIP.jlpcr-S1C9H89Kh50eJCtwHaHa?pid=Api&P=0&h=180"

    // }

}



searchBtn.addEventListener("click", () => {
    checkweather(searchBox.value);
});
</script>

</body>
</html>
